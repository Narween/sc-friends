<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>sc-friends</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1720;
    --bg-panel: #16212c;
    --bg-row: #1b2836;
    --bg-row-alt: #182430;
    --border: #26374a;
    --text: #dbe6f0;
    --text-dim: #7f92a3;
    --accent: #3fa9f5;
    --keep: #3fbf6b;
    --remove: #e5484d;
    --applied: #9a6bd6;
  }
  /* Thème clair : appliqué soit par préférence système ("auto", pas de
     data-theme posé), soit forcé via data-theme="light". data-theme gagne
     toujours sur la media query dans les deux sens. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --bg: #f4f6f9; --bg-panel: #ffffff; --bg-row: #eef2f6; --bg-row-alt: #f8fafc;
      --border: #dde4ec; --text: #1c2733; --text-dim: #64758a;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f6f9; --bg-panel: #ffffff; --bg-row: #eef2f6; --bg-row-alt: #f8fafc;
    --border: #dde4ec; --text: #1c2733; --text-dim: #64758a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 16px 24px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .summary { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-dim); }
  .summary b { color: var(--text); }
  .pill { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .pill.keep { background: rgba(63,191,107,0.15); color: var(--keep); }
  .pill.remove { background: rgba(229,72,77,0.15); color: var(--remove); }
  .pill.undecided { background: rgba(127,146,163,0.15); color: var(--text-dim); }
  .pill.applied { background: rgba(154,107,214,0.15); color: var(--applied); }

  .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .lang-switch button { padding: 4px 8px; font-size: 12px; }
  .lang-switch button.active { background: var(--accent); color: #06202f; border-color: var(--accent); }

  .toolbar {
    padding: 12px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
  }
  input, select, button {
    background: var(--bg-row);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type=text] { min-width: 220px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  button.primary { background: var(--accent); color: #06202f; font-weight: 600; border-color: var(--accent); }
  .bulk { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .bulk .count { color: var(--text-dim); font-size: 12px; }

  html, body { max-width: 100%; overflow-x: hidden; }
  main { padding: 16px 24px; }
  .table-scroll { width: 100%; overflow-x: auto; }
  table { width: 100%; min-width: 780px; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: middle; }
  tr:nth-child(even) td { background: var(--bg-row-alt); }
  tr.applied td { opacity: 0.55; }
  .friend { display: flex; align-items: center; gap: 8px; }
  .friend img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--bg-row); }
  .nickname { font-weight: 600; }
  .displayname { color: var(--text-dim); font-size: 12px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-online, .status-playing { background: var(--keep); }
  .status-away { background: #e5b800; }
  .status-offline { background: var(--text-dim); }
  .actions { display: flex; gap: 6px; }
  .actions button { padding: 4px 10px; font-size: 12px; }
  .actions button.active-keep { background: var(--keep); color: #06210f; border-color: var(--keep); }
  .actions button.active-remove { background: var(--remove); color: #310506; border-color: var(--remove); }
  .applied-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .applied-badge.ok { background: rgba(63,191,107,0.15); color: var(--keep); }
  .applied-badge.fail { background: rgba(229,72,77,0.15); color: var(--remove); }

  .pagination { display: flex; gap: 8px; align-items: center; margin-top: 16px; justify-content: center; color: var(--text-dim); }
  footer { padding: 16px 24px; color: var(--text-dim); font-size: 12px; }

  .panel { margin: 16px 24px; padding: 16px 20px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; }
  .panel h2 { margin: 0 0 8px; font-size: 14px; }
  .panel .dim { color: var(--text-dim); font-size: 13px; }
  .setup-steps { padding-left: 0; list-style: none; margin: 0; }
  .setup-steps li { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .setup-steps li:last-child { border-bottom: none; }
  .step-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .step-desc { flex: 1; min-width: 260px; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: rgba(127,146,163,0.15); color: var(--text-dim); white-space: nowrap; }
  .status.ok { background: rgba(63,191,107,0.15); color: var(--keep); }
  .status.missing { background: rgba(229,72,77,0.15); color: var(--remove); }
  .task-log { margin-top: 8px; max-height: 160px; overflow-y: auto; background: #0a1119; border: 1px solid var(--border); border-radius: 6px; padding: 8px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; display: none; }
  .empty-banner { background: rgba(63,169,245,0.12); border: 1px solid rgba(63,169,245,0.4); color: var(--accent); padding: 10px 14px; border-radius: 6px; font-weight: 600; margin: 0 0 14px; }
  #toggleSetup.attention { background: var(--accent); color: #06202f; border-color: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(63,169,245,0.5); } 50% { box-shadow: 0 0 0 6px rgba(63,169,245,0); } }

  .panel.danger { border-color: rgba(229,72,77,0.4); }
  .panel.danger h2 { color: var(--remove); }
  .danger-controls { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .danger-controls label { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .danger-btn { background: var(--remove); color: #fff; border-color: var(--remove); font-weight: 600; }
  .danger-btn:disabled { background: var(--bg-row); color: var(--text-dim); border-color: var(--border); }
</style>
</head>
<body>

<header>
  <h1>sc-friends</h1>
  <div class="summary" id="summary">…</div>
  <div class="header-actions">
    <div class="lang-switch" id="langSwitch"><!-- boutons générés dynamiquement depuis /api/languages --></div>
    <div class="lang-switch">
      <button id="themeAuto" data-theme-choice="auto" title="Système / System">🖥</button>
      <button id="themeDark" data-theme-choice="dark" title="Sombre / Dark">🌙</button>
      <button id="themeLight" data-theme-choice="light" title="Clair / Light">☀</button>
    </div>
    <button id="toggleSetup" data-i18n="setup.toggle"></button>
    <button id="toggleAbout" data-i18n="about.toggle"></button>
  </div>
</header>

<section class="panel" id="aboutPanel" style="display:none">
  <h2 data-i18n="about.title"></h2>
  <p class="dim" id="aboutBody">…</p>
  <p class="dim" data-i18n="about.disclaimer"></p>
  <p class="dim" id="aboutReferral"></p>
</section>

<section class="panel" id="setupPanel" style="display:none">
  <h2 data-i18n="setup.title"></h2>
  <p class="dim" data-i18n="setup.intro"></p>
  <p class="empty-banner" id="emptyBanner" data-i18n="setup.emptyBanner" style="display:none"></p>
  <ul class="setup-steps">
    <li>
      <div class="step-row">
        <div class="step-desc"><b>1. <span data-i18n="setup.step1.title"></span></b><br /><span class="dim" data-i18n="setup.step1.desc"></span></div>
        <span class="status" id="status-auth">…</span>
        <button id="runLogin" data-i18n="setup.run"></button>
        <button id="confirmLogin" style="display:none" data-i18n="setup.loginConfirm"></button>
      </div>
      <pre class="task-log" id="log-login"></pre>
    </li>
    <li>
      <div class="step-row">
        <div class="step-desc"><b>2. <span data-i18n="setup.step2.title"></span></b><br /><span class="dim" data-i18n="setup.step2.desc"></span></div>
        <span class="status" id="status-friendsJson">…</span>
        <button id="runFetch" data-i18n="setup.run"></button>
      </div>
      <pre class="task-log" id="log-fetch"></pre>
    </li>
    <li>
      <div class="step-row">
        <div class="step-desc"><b>3. <span data-i18n="setup.step3.title"></span></b><br /><span class="dim" data-i18n="setup.step3.desc"></span></div>
        <span class="status" id="status-db">…</span>
        <button id="runImport" data-i18n="setup.run"></button>
      </div>
      <pre class="task-log" id="log-import"></pre>
    </li>
  </ul>
</section>

<div class="toolbar">
  <input type="text" id="search" data-i18n-placeholder="toolbar.search" />
  <select id="decisionFilter">
    <option value="all" data-i18n="toolbar.decisionAll"></option>
    <option value="undecided" data-i18n="toolbar.decisionUndecided"></option>
    <option value="keep" data-i18n="toolbar.decisionKeep"></option>
    <option value="remove" data-i18n="toolbar.decisionRemove"></option>
  </select>
  <select id="statusFilter">
    <option value="all" data-i18n="toolbar.statusAll"></option>
    <option value="online" data-i18n="toolbar.statusOnline"></option>
    <option value="playing" data-i18n="toolbar.statusPlaying"></option>
    <option value="away" data-i18n="toolbar.statusAway"></option>
    <option value="offline" data-i18n="toolbar.statusOffline"></option>
  </select>
  <select id="sort">
    <option value="presence_since" data-i18n="toolbar.sortLastSeen"></option>
    <option value="nickname" data-i18n="toolbar.sortNickname"></option>
    <option value="displayname" data-i18n="toolbar.sortDisplayname"></option>
    <option value="common_communities_count" data-i18n="toolbar.sortOrgs"></option>
  </select>
  <button id="orderBtn">↑ asc</button>

  <div class="bulk">
    <span class="count" id="matchCount"></span>
    <button id="bulkKeep" data-i18n="toolbar.bulkKeep"></button>
    <button id="bulkRemove" data-i18n="toolbar.bulkRemove"></button>
    <button id="bulkClear" data-i18n="toolbar.bulkClear"></button>
  </div>
</div>

<main>
  <div class="table-scroll">
  <table>
    <thead>
      <tr>
        <th></th>
        <th data-i18n="table.status"></th>
        <th data-i18n="table.lastSeen"></th>
        <th data-i18n="table.orgs"></th>
        <th data-i18n="table.decision"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  </div>

  <div class="pagination">
    <button id="prevPage" data-i18n="pagination.prev"></button>
    <span id="pageInfo"></span>
    <button id="nextPage" data-i18n="pagination.next"></button>
    <select id="pageSize">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
      <option value="200">200</option>
      <option value="300">300</option>
      <option value="400">400</option>
      <option value="all" data-i18n="pagination.all"></option>
    </select>
  </div>

  <section class="panel danger">
    <h2 data-i18n="danger.title"></h2>
    <p class="dim" id="dangerDesc"></p>
    <div class="danger-controls">
      <label><span data-i18n="danger.limitLabel"></span> <input type="number" id="applyLimit" min="1" style="width:80px" /></label>
      <label><span data-i18n="danger.confirmLabel"></span> <input type="text" id="confirmText" placeholder="OUI" style="width:80px" /></label>
      <button id="applyBtn" class="primary danger-btn" disabled data-i18n="danger.launch"></button>
    </div>
    <pre id="applyLog" class="task-log"></pre>
  </section>
</main>

<footer data-i18n="footer.text"></footer>

<script>
const REFERRAL_CODE = 'STAR-9G4H-JJ4G';
const REFERRAL_URL = `https://www.robertsspaceindustries.com/enlist?referral=${REFERRAL_CODE}`;

// i18n: les traductions vivent dans i18n/*.json (servies par le serveur),
// pas dans ce fichier — ajouter une langue ne demande aucune modification de
// code, juste un nouveau i18n/<code>.json avec les mêmes clés. La liste des
// langues et le sélecteur sont générés dynamiquement à partir de ça.
let lang = localStorage.getItem('sc-friends-lang') || 'fr';
let dict = {};
let availableLangs = [];

function t(key, vars) {
  let str = dict[key] ?? key;
  if (vars) str = str.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
  return str;
}

async function loadLanguages() {
  availableLangs = await (await fetch('/api/languages')).json();
  if (!availableLangs.some((l) => l.code === lang)) lang = availableLangs[0]?.code || 'fr';
  const box = el('langSwitch');
  box.innerHTML = availableLangs
    .map((l) => `<button data-lang="${l.code}" title="${escapeHtml(l.name)}">${l.code.toUpperCase()}</button>`)
    .join('');
  box.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => setLang(btn.dataset.lang)));
}

async function loadDict(l) {
  dict = await (await fetch(`/i18n/${l}.json`)).json();
}

function applyTranslations() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  el('confirmText').placeholder = t('confirmWord');
  document.querySelectorAll('#langSwitch button').forEach((b) => b.classList.toggle('active', b.dataset.lang === lang));
  el('aboutReferral').innerHTML = t('about.referral').replace(
    '{code}',
    `<a href="${REFERRAL_URL}" target="_blank" rel="noopener">${REFERRAL_CODE}</a>`
  );
}

async function setLang(l) {
  lang = l;
  localStorage.setItem('sc-friends-lang', l);
  await loadDict(l);
  applyTranslations();
  loadSummary();
  loadRows();
}

// --- Thème clair / sombre / système ---
let theme = localStorage.getItem('sc-friends-theme') || 'auto';
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  ['Auto', 'Dark', 'Light'].forEach((id) => {
    document.getElementById('theme' + id).classList.toggle('active', theme === id.toLowerCase());
  });
}
function setTheme(t) {
  theme = t;
  localStorage.setItem('sc-friends-theme', t);
  applyTheme();
}
document.getElementById('themeAuto').addEventListener('click', () => setTheme('auto'));
document.getElementById('themeDark').addEventListener('click', () => setTheme('dark'));
document.getElementById('themeLight').addEventListener('click', () => setTheme('light'));
applyTheme();

const state = { search: '', decision: 'all', status: 'all', sort: 'presence_since', order: 'asc', page: 1, pageSize: 50 };

const el = (id) => document.getElementById(id);

function fmtDate(unixSeconds) {
  if (!unixSeconds) return `<span style="color:var(--text-dim)">${t('row.unknown')}</span>`;
  return new Date(unixSeconds * 1000).toISOString().slice(0, 10);
}

async function loadSummary() {
  const res = await fetch('/api/summary');
  const rows = await res.json();
  const counts = { keep: 0, remove: 0, undecided: 0, applied: 0, total: 0 };
  for (const r of rows) {
    counts.total += r.n;
    if (r.applied) counts.applied += r.n;
    else counts[r.decision] = (counts[r.decision] || 0) + r.n;
  }
  el('summary').innerHTML = `
    <span><b>${counts.total}</b></span>
    <span class="pill undecided">${counts.undecided || 0} ${t('row.undecided').toLowerCase()}</span>
    <span class="pill keep">${counts.keep || 0} ${t('row.keep').toLowerCase()}</span>
    <span class="pill remove">${counts.remove || 0} ${t('row.remove').toLowerCase()}</span>
    <span class="pill applied">${counts.applied || 0} ✓</span>
  `;
  el('dangerDesc').textContent = t('dangerDesc', { n: counts.remove || 0 });
}

function buildQuery(extra) {
  const p = new URLSearchParams({
    search: state.search, decision: state.decision, status: state.status,
    sort: state.sort, order: state.order, page: state.page, pageSize: state.pageSize,
    ...extra,
  });
  return p.toString();
}

async function loadRows() {
  const res = await fetch('/api/friends?' + buildQuery());
  const { total, rows } = await res.json();
  el('matchCount').textContent = t('unit.matches', { n: total });
  const showAll = state.pageSize === 'all';
  const totalPages = showAll ? 1 : Math.max(1, Math.ceil(total / state.pageSize));
  el('pageInfo').textContent = t('unit.page', { p: showAll ? 1 : state.page, tot: totalPages, total });
  el('prevPage').disabled = showAll || state.page <= 1;
  el('nextPage').disabled = showAll || state.page >= totalPages;

  el('rows').innerHTML = rows.map((f) => {
    const applied = !!f.applied_at;
    const rowCls = applied ? 'applied' : '';
    const badge = applied
      ? `<span class="applied-badge ${f.apply_success ? 'ok' : 'fail'}">${f.apply_success ? t('row.appliedOk') : t('row.appliedFail')}</span>`
      : `<div class="actions">
          <button data-id="${f.id}" data-set="keep" class="${f.decision === 'keep' ? 'active-keep' : ''}">${t('row.keep')}</button>
          <button data-id="${f.id}" data-set="remove" class="${f.decision === 'remove' ? 'active-remove' : ''}">${t('row.remove')}</button>
          <button data-id="${f.id}" data-set="">${t('row.undecided')}</button>
        </div>`;
    return `
      <tr class="${rowCls}">
        <td><div class="friend">
          <img src="${escapeHtml(f.avatar || '')}" onerror="this.style.visibility='hidden'" />
          <div><div class="nickname">${escapeHtml(f.nickname)}</div><div class="displayname">${escapeHtml(f.displayname)}</div></div>
        </div></td>
        <td><span class="status-dot status-${f.presence_status || 'offline'}"></span>${f.presence_status || '?'}</td>
        <td>${fmtDate(f.presence_since)}</td>
        <td>${f.common_communities_count}</td>
        <td>${badge}</td>
      </tr>`;
  }).join('');

  el('rows').querySelectorAll('button[data-id]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const setTo = btn.dataset.set || null;
      await fetch(`/api/friends/${encodeURIComponent(id)}/decision`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision: setTo }),
      });
      loadRows();
      loadSummary();
    });
  });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

el('search').addEventListener('input', debounce(() => { state.search = el('search').value; state.page = 1; loadRows(); }, 300));
el('decisionFilter').addEventListener('change', () => { state.decision = el('decisionFilter').value; state.page = 1; loadRows(); });
el('statusFilter').addEventListener('change', () => { state.status = el('statusFilter').value; state.page = 1; loadRows(); });
el('sort').addEventListener('change', () => { state.sort = el('sort').value; loadRows(); });
el('orderBtn').addEventListener('click', () => {
  state.order = state.order === 'asc' ? 'desc' : 'asc';
  el('orderBtn').textContent = state.order === 'asc' ? '↑ asc' : '↓ desc';
  loadRows();
});
el('prevPage').addEventListener('click', () => { if (state.page > 1) { state.page--; loadRows(); } });
el('nextPage').addEventListener('click', () => { state.page++; loadRows(); });
el('pageSize').addEventListener('change', () => {
  const v = el('pageSize').value;
  state.pageSize = v === 'all' ? 'all' : parseInt(v, 10);
  state.page = 1;
  loadRows();
});

async function bulkSet(setTo) {
  const label = setTo === 'keep' ? t('row.keep') : setTo === 'remove' ? t('row.remove') : t('row.undecided');
  if (!confirm(t('confirmBulk', { label, count: el('matchCount').textContent }))) return;
  const res = await fetch('/api/bulk-decision', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ search: state.search, decision: state.decision, status: state.status, setTo }),
  });
  const data = await res.json();
  alert(t('unit.updated', { n: data.updated }));
  loadRows();
  loadSummary();
}
el('bulkKeep').addEventListener('click', () => bulkSet('keep'));
el('bulkRemove').addEventListener('click', () => bulkSet('remove'));
el('bulkClear').addEventListener('click', () => bulkSet(null));

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// --- Panneau "remplir la base" ---
el('toggleSetup').addEventListener('click', () => {
  const panel = el('setupPanel');
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'block' : 'none';
  if (show) loadStatus();
});

// --- Panneau "à propos" ---
let aboutData = null;
el('toggleAbout').addEventListener('click', async () => {
  const panel = el('aboutPanel');
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'block' : 'none';
  if (show) {
    if (!aboutData) aboutData = await (await fetch('/api/about')).json();
    renderAbout();
  }
});
function renderAbout() {
  if (!aboutData) return;
  el('aboutBody').innerHTML = `<b>${aboutData.productName}</b> v${aboutData.version} — ${escapeHtml(aboutData.description)}<br />
    <a href="${aboutData.repository}" target="_blank" rel="noopener">${aboutData.repository}</a>`;
}

async function loadStatus() {
  const res = await fetch('/api/status');
  const s = await res.json();
  el('status-auth').className = `status ${s.auth.exists ? 'ok' : 'missing'}`;
  el('status-auth').textContent = s.auth.exists ? new Date(s.auth.mtime).toLocaleString() : '—';
  el('status-friendsJson').className = `status ${s.friendsJson.exists ? 'ok' : 'missing'}`;
  el('status-friendsJson').textContent = s.friendsJson.exists ? new Date(s.friendsJson.mtime).toLocaleString() : '—';
  el('status-db').className = `status ${s.db.exists ? 'ok' : 'missing'}`;
  el('status-db').textContent = s.db.exists ? `${s.db.count}` : '—';

  // Étapes verrouillées dans l'ordre : pas la peine de récupérer sans être
  // connecté, ni d'importer sans avoir récupéré.
  el('runFetch').disabled = !s.auth.exists;
  el('runFetch').title = s.auth.exists ? '' : t('setup.stepLocked');
  el('runImport').disabled = !s.friendsJson.exists;
  el('runImport').title = s.friendsJson.exists ? '' : t('setup.stepLocked');

  const isEmpty = !s.db.exists || !s.db.count;
  el('emptyBanner').style.display = isEmpty ? 'block' : 'none';
  el('toggleSetup').classList.toggle('attention', isEmpty);

  return isEmpty;
}

const activeStreams = {};
function runTask(name, logElId, { onDone, body } = {}) {
  return fetch(`/api/run/${name}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, lang }),
  }).then(async (res) => {
    if (res.status === 409) { alert(t('alreadyRunning')); return; }
    const logEl = el(logElId);
    logEl.style.display = 'block';
    logEl.textContent = '';
    if (activeStreams[name]) activeStreams[name].close();
    const es = new EventSource(`/api/run/${name}/events`);
    activeStreams[name] = es;
    es.onmessage = (e) => {
      logEl.textContent += JSON.parse(e.data) + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    };
    es.addEventListener('done', (e) => {
      logEl.textContent += t('done', { code: e.data });
      es.close();
      if (onDone) onDone(Number(e.data));
    });
  });
}

el('runLogin').addEventListener('click', () => {
  el('confirmLogin').style.display = 'inline-block';
  runTask('login', 'log-login', { onDone: () => { el('confirmLogin').style.display = 'none'; loadStatus(); } });
});
el('confirmLogin').addEventListener('click', () => fetch('/api/login-confirm', { method: 'POST' }));
el('runFetch').addEventListener('click', () => runTask('fetch', 'log-fetch', { onDone: () => loadStatus() }));
el('runImport').addEventListener('click', () => runTask('import', 'log-import', { onDone: () => { loadStatus(); loadSummary(); loadRows(); } }));

// --- Suppression réelle ---
el('confirmText').addEventListener('input', () => {
  el('applyBtn').disabled = el('confirmText').value !== t('confirmWord');
});

el('applyBtn').addEventListener('click', () => {
  if (el('confirmText').value !== t('confirmWord')) return;
  if (!confirm(t('lastConfirm'))) return;

  const limitVal = parseInt(el('applyLimit').value, 10);
  const body = Number.isInteger(limitVal) && limitVal > 0 ? { limit: limitVal } : {};

  el('applyBtn').disabled = true;
  el('confirmText').value = '';

  runTask('apply', 'applyLog', { body, onDone: () => { loadSummary(); loadRows(); } });
});

(async () => {
  await loadLanguages();
  await loadDict(lang);
  applyTranslations();
  loadSummary();
  loadRows();

  const isEmpty = await loadStatus();
  if (isEmpty) el('setupPanel').style.display = 'block';
})();
</script>
</body>
</html>
